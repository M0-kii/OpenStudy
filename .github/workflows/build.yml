name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2022
            bundle: nsis
            artifact: OpenStudy-windows-x64
            path: src-tauri/target/release/bundle/nsis/*.exe
          - platform: macOS Apple Silicon
            runner: macos-15
            bundle: dmg
            artifact: OpenStudy-macos-arm64
            path: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: Linux x64
            runner: ubuntu-22.04
            bundle: deb
            artifact: OpenStudy-linux-x64
            path: src-tauri/target/release/bundle/deb/*.deb

    env:
      RUSTUP_TOOLCHAIN: stable

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build desktop installer
        run: pnpm tauri build --ci --bundles ${{ matrix.bundle }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    concurrency:
      group: openstudy-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: OpenStudy-*
          path: installers
          merge-multiple: true

      - name: Publish installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          windows=(installers/*.exe)
          macos=(installers/*.dmg)
          linux=(installers/*.deb)
          if (( ${#windows[@]} != 1 || ${#macos[@]} != 1 || ${#linux[@]} != 1 )); then
            echo "Expected one Windows installer, one macOS disk image, and one Linux package."
            exit 1
          fi

          tag="$GITHUB_REF_NAME"
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)
          assets=("${windows[@]}" "${macos[@]}" "${linux[@]}")
          if [[ "$draft" == true ]]; then
            gh release upload "$tag" --clobber "${assets[@]}"
            gh release edit "$tag" --draft=false
          elif [[ "$draft" != false ]]; then
            gh release create "$tag" --verify-tag --title "OpenStudy ${tag#v}" --notes-from-tag "${assets[@]}"
          fi
