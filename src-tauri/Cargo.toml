[package]
name = "openstudy"
version = "0.1.0"
description = "A desktop space for focused reading"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
tauri-plugin-opener = "2"
